:root{--bg:#06110E;--pri:#34D399;--sec:#FFF9EF;--ter:#00E1EF;--red:#FF5A5F;--card:#0B1F19;--mut:#8FB5A8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#020605;color:var(--sec);font-family:'Readex Pro',sans-serif;overflow:hidden}
#wrap{position:absolute;left:50%;top:0;width:1080px;height:1920px;transform-origin:50% 0}

#shk,#art,#ui,#ov{position:absolute;inset:0}
.el{position:absolute;left:0;top:0;visibility:hidden}
.head{width:960px;text-align:center;font:700 96px/1.08 'Reem Kufi';color:var(--sec);text-transform:uppercase;letter-spacing:-1px;text-shadow:0 6px 0 #06110E}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding:0 4px 8px}
.w{display:inline-block}
.r{color:var(--red)}.g{color:var(--pri)}.c{color:var(--ter)}
.lbl{font:700 44px/1.1 'Readex Pro';color:var(--sec);text-align:center;white-space:nowrap}
.src{font:500 28px/1.2 'Readex Pro';color:var(--mut);text-align:center;white-space:nowrap;background:#06110Ecc;padding:6px 16px;border-radius:14px}
.big{text-align:center;background:#0B1F19e6;border:3px solid var(--ter);border-radius:32px;padding:14px 44px}
.big .n{font:700 150px/1 'Reem Kufi';color:var(--sec)}.big .t{font:700 36px/1 'Readex Pro';color:var(--ter);margin-top:4px}
.fact{font:700 40px/1.2 'Readex Pro';color:var(--sec);background:var(--card);border:3px solid var(--ter);padding:18px 30px;border-radius:30px;white-space:nowrap}
.fact b{color:var(--ter)}
.fact.rd{border-color:var(--red)}.fact.rd b{color:var(--red)}
.side{font:700 56px/1 'Reem Kufi';color:var(--sec);background:var(--card);border:5px solid var(--ter);padding:22px 34px;border-radius:24px;white-space:nowrap}
.side.rd{border-color:var(--red)}
.taunt{font:700 50px/1.1 'Readex Pro';color:var(--sec);background:var(--red);padding:20px 38px;border-radius:40px;white-space:nowrap}
.card{width:920px;background:var(--card);border:2px solid #34D39980;border-radius:40px;padding:46px 50px 38px;text-align:center}
.card .ar{font:700 72px/1.75 Amiri;direction:rtl;color:var(--sec)}
.card.sm .ar{font-size:60px;line-height:1.7}
.card .tr{font:500 40px/1.4 'Readex Pro';color:var(--sec);margin-top:18px}
.card .ref{font:700 30px/1.3 'Readex Pro';color:var(--ter);margin-top:24px}
.card .brand{display:flex;gap:10px;align-items:center;justify-content:center;font:700 24px/1 'Readex Pro';color:var(--mut);margin-top:20px}
.card .brand img{width:34px;height:34px}
.chipar{font:700 40px/1.2 'Readex Pro';color:var(--sec);background:var(--card);border:3px solid var(--ter);padding:12px 30px;border-radius:40px;white-space:nowrap;display:flex;gap:18px;align-items:center}
.chipar span{font:700 50px/1 Amiri;color:var(--ter)}
.yr{font:700 52px/1 'Reem Kufi';color:var(--mut);background:var(--card);border:4px solid #8FB5A866;padding:18px 28px;border-radius:40px;white-space:nowrap}
.arrowtx{font:700 52px/1 'Reem Kufi';color:var(--mut)}
.brandname{font:700 92px/1 'Reem Kufi';color:var(--sec);white-space:nowrap}
.dl{font:700 48px/1 'Reem Kufi';color:var(--bg);background:var(--ter);padding:24px 48px;border-radius:60px;white-space:nowrap}
#logoBig{width:460px;height:460px}
#wm{left:80px;top:262px;display:flex;gap:12px;align-items:center;font:700 30px/1 'Reem Kufi';color:var(--sec)}
#wm img{width:52px;height:52px}
#progbg{position:absolute;left:80px;top:236px;width:920px;height:6px;background:#ffffff1c;border-radius:3px}
#prog{width:100%;height:100%;background:var(--pri);border-radius:3px;transform-origin:0 50%}
#ctl{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;gap:12px;align-items:center;padding:0 16px;background:#0B1F19;font:500 14px 'Readex Pro'}
#ctl input[type=range]{flex:1}
#ctl button{font:700 14px 'Readex Pro';background:#34D399;color:#06110E;border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
body.render #ctl{display:none}
.bub{font:700 40px/1 'Reem Kufi';color:#06110E;background:#FFF9EF;padding:12px 24px;border-radius:30px 30px 30px 6px;white-space:nowrap}
.fact svg{vertical-align:-8px;margin-right:10px}
#crown svg{width:200px;height:120px}
</style>

const vo=$('#vo'),sk=$('#seek'),tm=$('#time');let playing=false,t0=0,c0=0;
window.seek=t=>{tl.seek(Math.max(0,Math.min(DURATION,t)),false);sk.value=t;tm.textContent=fmt(t,2)+' dtk'};
function loop(){if(!playing)return;const t=c0+(performance.now()-t0)/1000;if(t>=DURATION){playing=false;$('#play').textContent='Play';vo.pause();return}seek(t);requestAnimationFrame(loop)}
$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'Pause':'Play';if(playing){c0=+sk.value>=DURATION?0:+sk.value;t0=performance.now();vo.currentTime=c0;vo.play().catch(()=>{});loop()}else vo.pause()};
sk.oninput=()=>{seek(+sk.value);if(playing){c0=+sk.value;t0=performance.now();vo.currentTime=c0}};
$('#file').onchange=e=>{vo.src=URL.createObjectURL(e.target.files[0])};
function fit(){const s=Math.min((innerHeight-(document.body.classList.contains('render')?0:56))/1920,innerWidth/1080);$('#wrap').style.transform=`translateX(-50%) scale(${s})`}
