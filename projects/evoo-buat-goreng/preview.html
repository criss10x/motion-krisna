<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVOO Cek Dulu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,800;1,9..144,900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{--bg:#F5F1E6;--g:#1E4D3A;--k:#E9A23B;--r:#E25C3B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111}
body{display:flex;flex-direction:column;align-items:center;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden}
#wrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#holder{position:relative;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);transform-origin:0 0;color:var(--g)}
.L{position:absolute;inset:0}
.a{position:absolute}
#ctl{display:flex;gap:12px;align-items:center;padding:10px 16px;color:#ddd;font:14px system-ui;width:min(720px,100%)}
#ctl input[type=range]{flex:1}
#ctl button,#ctl label{background:#2a2a2a;color:#eee;border:1px solid #444;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
body.render{background:var(--bg)} body.render #ctl{display:none} body.render #wrap{display:block}
.title{position:absolute;left:80px;right:80px;text-align:center;font-family:Fraunces,serif;font-style:italic;font-weight:800;line-height:1.04;letter-spacing:-.01em;color:var(--g)}
.ln{display:block;white-space:nowrap}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .14em .12em .04em;margin:0 -.1em -.12em 0}
.i{display:inline-block;position:relative;z-index:0}
.w.r .i{color:var(--r)}
.mk{position:absolute;left:-.04em;right:.04em;bottom:.12em;height:.38em;background:var(--k);z-index:-1;transform-origin:0 50%;border-radius:.06em}
.pill{position:absolute;white-space:nowrap;border-radius:999px;font-weight:800;letter-spacing:.06em}
.src{position:absolute;left:50%;top:1452px;font:600 24px 'Plus Jakarta Sans';letter-spacing:.02em;color:var(--g);background:rgba(30,77,58,.08);padding:8px 22px;border-radius:999px;white-space:nowrap}
.hl{position:absolute;right:0;top:50%;transform:translateY(-50%);white-space:nowrap}
</style>
</head>
<body>
<div id="wrap"><div id="holder"><div id="stage">
  <svg width="0" height="0" style="position:absolute"><defs>
    <radialGradient id="ol" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#a9bf63"/><stop offset=".55" stop-color="#6f8a35"/><stop offset="1" stop-color="#3f5520"/></radialGradient>
    <linearGradient id="gk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c977"/><stop offset="1" stop-color="#E9A23B"/></linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d6b51"/><stop offset="1" stop-color="#1E4D3A"/></linearGradient>
    <radialGradient id="oil" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#f3d77a"/><stop offset="1" stop-color="#d9a93a"/></radialGradient>
    <filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .12  0 0 0 0 .2  0 0 0 0 .15  0 0 0 .9 0"/></filter>
  </defs></svg>

  <div id="bg" class="L">
    <div class="a blob" style="left:620px;top:120px;width:760px;height:760px;border-radius:50%;background:#E9A23B;opacity:.13"></div>
    <div class="a blob" style="left:-360px;top:1150px;width:920px;height:920px;border-radius:50%;background:#1E4D3A;opacity:.07"></div>
    <div class="a blob" style="left:-120px;top:120px;width:380px;height:380px;border-radius:50%;background:#E9A23B;opacity:.08"></div>
  </div>
  <div id="leaves" class="L"></div>
  <div id="seeds" class="L"></div>
  <svg class="L" width="1080" height="1920" style="opacity:.06"><rect width="1080" height="1920" filter="url(#nz)"/></svg>

  <div id="cam" class="L">
    <div class="title" id="t1a" data-fs="140" style="top:360px"><span class="ln" data-t="EVOO BUAT _GORENG?"></span></div>
    <div class="title" id="t1b" data-fs="120" style="top:520px"><span class="ln" data-t="*NGGAK BOLEH?"></span></div>
    <div class="title" id="t1c" data-fs="150" style="top:510px"><span class="ln" data-t="_SALAH!"></span></div>
    <div class="pill" id="p2" style="left:50%;top:400px;background:var(--g);color:var(--bg);font-size:44px;padding:18px 40px">PENELITIAN · 2018</div>
    <div class="title" id="t2a" data-fs="150" style="top:360px"><span class="ln" data-t="PALING _STABIL"></span></div>
    <div class="title" id="t3a" data-fs="140" style="top:360px"><span class="ln" data-t="API _SEDANG"></span></div>
    <div class="title" id="t3b" data-fs="110" style="top:510px"><span class="ln" data-t="*JANGAN BERASAP"></span></div>

    <!-- dapur: termometer + wajan (belakang), karakter, wajan depan -->
    <div id="kit" class="L">
      <svg class="L" id="kitBack" viewBox="0 0 1080 1920" width="1080" height="1920" style="overflow:visible">
        <g id="thermo">
          <rect x="88" y="740" width="64" height="520" rx="32" fill="#fff" stroke="#1E4D3A" stroke-width="7"/>
          <clipPath id="tc"><rect x="102" y="756" width="36" height="500" rx="18"/></clipPath>
          <g clip-path="url(#tc)"><rect id="merc" x="102" y="756" width="36" height="500" fill="#E25C3B"/></g>
          <circle cx="120" cy="1290" r="46" fill="#E25C3B" stroke="#1E4D3A" stroke-width="7"/>
          <path d="M152 840 L176 840 M152 1060 L176 1060" stroke="#1E4D3A" stroke-width="5" stroke-linecap="round"/>
        </g>
        <g id="flames">${0}</g>
        <ellipse cx="620" cy="1120" rx="250" ry="62" fill="#1E4D3A"/>
        <ellipse id="oilS" cx="620" cy="1122" rx="226" ry="50" fill="url(#oil)"/>
        <path d="M480 1110 Q520 1100 560 1112" stroke="#fff" stroke-width="6" opacity=".55" fill="none" stroke-linecap="round"/>
        <g id="waves" opacity="0"></g>
      </svg>
      <div class="pill" id="lSmoke" style="left:190px;top:816px;background:var(--r);color:#fff;font-size:24px;padding:8px 16px">ASAP ±190°C</div>
      <div class="pill" id="lMed" style="left:190px;top:1036px;background:var(--g);color:var(--bg);font-size:24px;padding:8px 16px">API SEDANG</div>
    </div>
    <div class="a" id="noPan" style="left:430px;top:900px;width:380px;height:380px"><svg viewBox="-190 -190 380 380" width="380" height="380"><circle r="160" fill="none" stroke="#E25C3B" stroke-width="26"/><line x1="-112" y1="112" x2="112" y2="-112" stroke="#E25C3B" stroke-width="26" stroke-linecap="round"/></svg></div>
    <div id="chia" class="a" style="left:0;top:0;width:340px;height:430px"><div id="chiaSq" style="width:100%;height:100%"></div></div>
    <svg class="L" id="kitFront" viewBox="0 0 1080 1920" width="1080" height="1920" style="overflow:visible;pointer-events:none">
      <path d="M370 1120 A250 62 0 0 0 870 1120 L846 1178 Q620 1290 394 1178 Z" fill="url(#gb)"/>
      <path d="M370 1120 A250 62 0 0 0 870 1120" stroke="url(#gk)" stroke-width="10" fill="none"/>
      <rect x="860" y="1104" width="150" height="30" rx="15" fill="#c98a2a" transform="rotate(-8 860 1119)"/>
      <path d="M430 1196 Q620 1262 810 1196" stroke="#fff" stroke-width="7" opacity=".25" fill="none" stroke-linecap="round"/>
      <g id="smoke" opacity="0"></g>
      <g id="smokeX"><line x1="500" y1="760" x2="740" y2="980" stroke="#E25C3B" stroke-width="20" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330"/><line x1="740" y1="760" x2="500" y2="980" stroke="#E25C3B" stroke-width="20" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330"/></g>
    </svg>
    <div class="a" id="shield" style="left:760px;top:830px;width:110px;height:110px;border-radius:50%;background:var(--k);border:6px solid var(--g);display:flex;align-items:center;justify-content:center"><svg width="56" height="56" viewBox="-32 -32 64 64"><path d="M-16 1 L-5 12 L17 -12" stroke="#1E4D3A" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="a" id="stamp" style="left:50%;top:640px;background:var(--k);border:12px solid var(--g);border-radius:28px;padding:10px 64px;font:italic 900 190px Fraunces;color:var(--g);white-space:nowrap;box-shadow:0 24px 40px rgba(30,77,58,.25)">BOLEH</div>
    <div class="pill" id="save" style="left:50%;top:1330px;background:var(--g);color:var(--bg);font-size:44px;padding:20px 44px">SIMPAN DULU</div>
    <div class="a" id="t5" style="left:80px;right:80px;top:540px;text-align:center">
      <div style="font:800 92px 'Plus Jakarta Sans';letter-spacing:-.01em;color:var(--g)">@mindset.sehat8</div>
      <div style="font:italic 800 64px Fraunces;color:var(--g);margin-top:2px">Viral? <span style="background:linear-gradient(transparent 58%,#E9A23B 58%,#E9A23B 92%,transparent 92%)">Cek dulu.</span></div>
    </div>
  </div>

  <div id="hdr" class="a" style="left:80px;right:80px;top:250px;height:56px;border-bottom:2px solid rgba(30,77,58,.22);font:800 24px 'Plus Jakarta Sans';letter-spacing:.2em;color:var(--g)">
    <span style="position:absolute;left:0;top:50%;transform:translateY(-50%)">VIRAL? CEK DULU · NO. 02</span>
    <span id="hls"></span>
  </div>
  <div id="prog" class="a" style="left:80px;top:314px;width:920px;height:6px;border-radius:3px;background:var(--k);transform-origin:0 50%"></div>
</div></div></div>
<div id="ctl"><button id="pp">Play</button><input id="sl" type="range" min="0" step="0.01" value="0"><span id="tm">0.00</span><label>Pilih audio<input id="fi" type="file" accept="audio/*" hidden></label></div>
<audio id="au" src="narasi.mp3" preload="auto"></audio>

<script>
const CUES = {"w":1080,"h":1920,"fps":30,"duration":16.87,"estimated":false,"music":false,"sfx":"halus","scenes":[{"id":1,"start":0,"end":3.59,"keywords":[{"word":"goreng","t":1.5},{"word":"salah","t":2.7}]},{"id":2,"start":3.59,"end":9.07,"keywords":[{"word":"dipanaskan","t":5.63},{"word":"stabil","t":8.23}]},{"id":3,"start":9.07,"end":11.99,"keywords":[{"word":"sedang","t":9.71},{"word":"berasap","t":11.17}]},{"id":4,"start":11.99,"end":15.67,"keywords":[{"word":"boleh","t":12.93},{"word":"simpan","t":13.21}]},{"id":5,"start":15.67,"end":16.87,"keywords":[]}]};

const RENDER = location.search.includes('render');
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const D = CUES.duration, S = i => CUES.scenes[i - 1], K = (i, w) => S(i).keywords.find(k => k.word === w).t;
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const f1 = n => n.toFixed(1);

/* karakter: Si Zaitun (buah zaitun + daun) */
const arm = s => `<g class="arm${s > 0 ? 'R' : 'L'}"><path d="M${98 * s} 10 Q${140 * s} 50 ${150 * s} 95" stroke="#2f3f17" stroke-width="15" fill="none" stroke-linecap="round"/><circle cx="${150 * s}" cy="97" r="13" fill="#2f3f17"/></g>`;
$('#chiaSq').innerHTML = `<svg viewBox="-170 -240 340 430" width="340" height="430" style="overflow:visible"><g class="breath">
 <ellipse cx="0" cy="168" rx="100" ry="15" fill="#1E4D3A" opacity=".16"/>
 <ellipse cx="-42" cy="150" rx="30" ry="14" fill="#2f3f17"/><ellipse cx="42" cy="150" rx="30" ry="14" fill="#2f3f17"/>${arm(-1)}${arm(1)}
 <path d="M0 -140 Q6 -170 22 -186" stroke="#5a4a1c" stroke-width="10" fill="none" stroke-linecap="round"/>
 <path class="leaf" d="M18 -182 C40 -230 100 -232 126 -206 C96 -176 50 -168 18 -182 Z" fill="url(#gb)"/><path d="M26 -184 L114 -206" stroke="#F5F1E6" stroke-width="3" opacity=".5"/>
 <ellipse rx="112" ry="145" fill="url(#ol)"/>
 <ellipse cx="-48" cy="-82" rx="26" ry="46" fill="#fff" opacity=".22" transform="rotate(-22 -48 -82)"/>
 <g class="eyes"><circle cx="-38" cy="-28" r="27" fill="#fff"/><circle cx="38" cy="-28" r="27" fill="#fff"/>
  <g class="pup"><circle cx="-36" cy="-25" r="14" fill="#141310"/><circle cx="40" cy="-25" r="14" fill="#141310"/><circle cx="-31" cy="-31" r="5" fill="#fff"/><circle cx="45" cy="-31" r="5" fill="#fff"/></g></g>
 <ellipse cx="-68" cy="14" rx="16" ry="9" fill="#E25C3B" opacity=".45"/><ellipse cx="68" cy="14" rx="16" ry="9" fill="#E25C3B" opacity=".45"/>
 <path class="mS" d="M-28 26 Q0 56 28 26" stroke="#F5F1E6" stroke-width="7" fill="none" stroke-linecap="round"/>
 <ellipse class="mO" cx="0" cy="40" rx="13" ry="17" fill="#141310" stroke="#F5F1E6" stroke-width="5" opacity="0"/>
 <path class="mF" d="M-20 38 L20 34" stroke="#F5F1E6" stroke-width="7" stroke-linecap="round" opacity="0"/></g>
 <g class="crown"><path d="M-70 -126 L-82 -198 L-40 -162 L0 -214 L40 -162 L82 -198 L70 -126 Z" fill="url(#gk)" stroke="#1E4D3A" stroke-width="5" stroke-linejoin="round"/>
 <text x="0" y="-138" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="26" fill="#1E4D3A" letter-spacing="2">VIRAL</text>
 <g class="nocap"><circle cx="0" cy="-166" r="66" fill="none" stroke="#E25C3B" stroke-width="13"/><line x1="-46" y1="-120" x2="46" y2="-212" stroke="#E25C3B" stroke-width="13" stroke-linecap="round"/></g></g></svg>`;

// api kompor, gelombang panas, asap
const flame = (x, k) => `<g class="fl" transform="translate(${x} 1300)"><g class="fi"><path d="M0 30 C-40 30 -46 -10 -20 -36 C-16 -16 -4 -18 -6 -34 C-4 -56 12 -68 16 -82 C24 -52 46 -36 40 -6 C36 18 22 30 0 30 Z" fill="#E25C3B"/><path d="M0 24 C-18 24 -20 6 -9 -8 C-4 0 2 -4 2 -16 C12 -6 20 4 16 12 C14 20 8 24 0 24 Z" fill="#f6c977"/></g></g>`;
$('#flames').innerHTML = flame(520) + flame(620) + flame(720);
$('#waves').innerHTML = [520, 620, 720].map(x => `<path class="wv" d="M${x} 1050 q-18 -30 0 -60 q18 -30 0 -60 q-18 -30 0 -60" stroke="#E9A23B" stroke-width="9" fill="none" stroke-linecap="round" opacity=".8"/>`).join('');
$('#smoke').innerHTML = [[560, 900], [640, 860], [700, 930], [600, 800]].map(([x, y], k) => `<g class="pf"><circle cx="${x}" cy="${y}" r="${46 + k * 6}" fill="#8f978f"/><circle cx="${x + 40}" cy="${y + 10}" r="34" fill="#8f978f"/><circle cx="${x - 36}" cy="${y + 14}" r="30" fill="#8f978f"/></g>`).join('');

(() => { // motif latar
  const R = rng(5); let lv = '', sd = '';
  [[40, 560, 30], [-20, 980, -20], [1000, 640, 200], [1030, 1180, 150], [60, 1560, 10], [980, 1620, 190], [30, 200, 40]].forEach(([x, y, r], k) => {
    lv += `<svg class="a lf" style="left:${x - 60}px;top:${y - 40}px" width="140" height="90" viewBox="-10 -45 140 90"><g transform="rotate(${r} 60 0)"><path d="M0 0 C30 -40 90 -40 120 0 C90 40 30 40 0 0 Z" fill="#1E4D3A" opacity="${k % 2 ? .1 : .16}"/><path d="M6 0 L112 0" stroke="#F5F1E6" stroke-width="3" opacity=".5"/></g></svg>`;
  });
  for (let k = 0; k < 22; k++) { const x = R() * 1080, y = 200 + R() * 1500; sd += `<div class="a sd" style="left:${f1(x)}px;top:${f1(y)}px;width:${f1(12 + R() * 6)}px;height:${f1(9 + R() * 4)}px;border-radius:50%;background:#6f8a35;opacity:${(.12 + R() * .14).toFixed(2)}"></div>`; }
  $('#leaves').innerHTML = lv; $('#seeds').innerHTML = sd;
})();

$$('.ln[data-t]').forEach(el => {
  el.innerHTML = el.dataset.t.split(' ').map(w => {
    let c = ''; if (w[0] == '*') { c = 'r'; w = w.slice(1); } else if (w[0] == '_') { c = 'h'; w = w.slice(1); }
    return `<span class="w ${c}"><span class="i">${c == 'h' ? '<i class="mk"></i>' : ''}${w}</span></span>`;
  }).join(' ');
});
function fit() {
  $$('.title[data-fs]').forEach(t => {
    let fs = +t.dataset.fs; t.style.fontSize = fs + 'px';
    while (fs > 40 && [...t.querySelectorAll('.ln')].some(l => l.scrollWidth > 920)) { fs -= 4; t.style.fontSize = fs + 'px'; }
  });
}

window.SFX = [];
const sfx = (type, t, vol = 1) => SFX.push({ type, t: +t.toFixed(3), vol });
let tl;
function build() {
  tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  const reveal = (sel, t) => {
    const ii = $$(sel + ' .i');
    tl.fromTo(ii, { yPercent: 115, rotate: 5 }, { yPercent: 0, rotate: 0, duration: .55, ease: 'back.out(1.7)', stagger: .07 }, t);
    const mk = ii.map(i => i.querySelector('.mk')).filter(Boolean);
    if (mk.length) tl.fromTo(mk, { scaleX: 0 }, { scaleX: 1, duration: .4, ease: 'power2.out', stagger: .08 }, t + .3);
    sfx('pop', t, .5);
  };
  const conceal = (sel, t) => tl.to($$(sel + ' .i'), { yPercent: -115, duration: .3, ease: 'power2.in', stagger: .03 }, t);
  const pop = (sel, t, from = { scale: 0 }, d = .5) => { tl.fromTo(sel, { autoAlpha: 0, ...from }, { autoAlpha: 1, scale: 1, x: 0, y: 0, rotate: 0, duration: d, ease: 'back.out(1.8)' }, t); sfx('pop', t, .6); };
  const out = (sel, t, d = .3) => tl.to(sel, { autoAlpha: 0, scale: .6, duration: d, ease: 'power2.in' }, t);
  const mouth = (m, t) => ['mS', 'mO', 'mF'].forEach(k => tl.set('#chia .' + k, { opacity: k == m ? 1 : 0 }, t));
  const look = (x, y, t) => tl.to('#chia .pup', { x, y, duration: .25, ease: 'power2.out' }, t);
  const go = (x, y, sc, t, d = .6) => tl.to('#chia', { x, y, scale: sc, duration: d, ease: 'power3.inOut' }, t);
  const squash = t => tl.fromTo('#chiaSq', { scaleY: .82, scaleX: 1.14 }, { scaleY: 1, scaleX: 1, duration: .55, ease: 'elastic.out(1,.45)', transformOrigin: '50% 92%' }, t);
  const armR = (r, t, d = .35) => tl.to('#chia .armR', { rotate: r, svgOrigin: '98 10', duration: d, ease: 'back.out(2)' }, t);
  const armL = (r, t, d = .35) => tl.to('#chia .armL', { rotate: r, svgOrigin: '-98 10', duration: d, ease: 'back.out(2)' }, t);
  const shake = t => tl.to('#cam', { keyframes: { x: [0, -16, 13, -9, 6, -3, 0], y: [0, 9, -7, 5, -3, 1, 0] }, duration: .32, ease: 'none' }, t);
  const heat = (lv, t, d = .6) => { tl.to('#merc', { y: 500 * (1 - lv), duration: d, ease: 'power2.inOut' }, t); tl.to('.fi', { scale: .55 + lv * .7, transformOrigin: '50% 100%', duration: d, ease: 'back.out(2)', stagger: .05 }, t); };

  gsap.set('#p2,#src2,#lSmoke,#lMed,#thermo,#shield,#stamp,#save,#t5,#noPan', { autoAlpha: 0 });
  gsap.set('.src,#p2,#stamp,#save', { xPercent: -50 });
  gsap.set('#stamp', { rotate: -8 });
  gsap.set('#chia', { xPercent: -50, yPercent: -50, x: 270, y: 1080, scale: .85 });
  gsap.set('#chia .nocap', { scale: 0, transformOrigin: '50% 50%' });
  gsap.set('#merc', { y: 440 }); gsap.set('.fi', { scale: .55, transformOrigin: '50% 100%' });
  $$('.i').forEach(i => gsap.set(i, { yPercent: 115 })); gsap.set('#t1a .i', { yPercent: 0 });
  gsap.set('#t1a .mk', { scaleX: 1 });

  const HL = ['EVOO', 'FAKTA', 'ATURAN AMAN', 'VERDICT', 'FOLLOW'];
  $('#hls').innerHTML = HL.map(h => `<span class="hl">${h}</span>`).join('');
  const hls = $$('.hl'); gsap.set(hls, { autoAlpha: 0 }); gsap.set(hls[0], { autoAlpha: 1 });
  HL.forEach((_, k) => { if (k) { tl.set(hls[k - 1], { autoAlpha: 0 }, S(k + 1).start); tl.fromTo(hls[k], { autoAlpha: 0, x: 20 }, { autoAlpha: 1, x: 0, duration: .35 }, S(k + 1).start); } });
  tl.fromTo('#prog', { scaleX: 0 }, { scaleX: 1, duration: D, ease: 'none' }, 0);

  CUES.scenes.forEach(s => tl.fromTo('#cam', { scale: 1 }, { scale: 1.035, duration: s.end - s.start, ease: 'none', transformOrigin: '50% 48%', immediateRender: false }, s.start));
  $$('.blob').forEach((b, k) => tl.to(b, { x: [40, -50, 30][k], y: [60, -40, -50][k], duration: D, ease: 'sine.inOut' }, 0));
  $$('.lf').forEach((l, k) => tl.to(l, { rotate: k % 2 ? 6 : -6, y: 10, duration: 2.6 + k * .3, ease: 'sine.inOut', yoyo: true, repeat: Math.ceil(D / 2.6) }, 0));
  $$('.sd').forEach((d, k) => tl.to(d, { y: -(30 + k % 5 * 12), x: (k % 3 - 1) * 14, duration: 3 + k % 4, ease: 'sine.inOut', yoyo: true, repeat: Math.ceil(D / 3) }, 0));
  tl.to('#chia .breath', { scaleY: 1.025, scaleX: .99, svgOrigin: '0 165', duration: .9, ease: 'sine.inOut', yoyo: true, repeat: Math.ceil(D / .9) }, 0);
  const BR = rng(77); for (let t = 1.2; t < D; t += 2.6 + BR() * 1.6) tl.to('#chia .eyes', { scaleY: .1, svgOrigin: '0 -28', duration: .07, yoyo: true, repeat: 1, ease: 'power1.in' }, t);
  $$('.fl').forEach((f, k) => tl.to(f.querySelector('.fi'), { scaleX: 1.12, duration: .22 + k * .04, yoyo: true, repeat: Math.ceil(D / .22), ease: 'sine.inOut', transformOrigin: '50% 100%' }, 0));

  /* S1 hook: teks sudah tampil frame 0 */
  tl.fromTo('#t1a', { scale: 1.16 }, { scale: 1, duration: .55, ease: 'back.out(1.6)' }, 0);
  tl.fromTo('#chia', { y: 1900 }, { y: 1080, duration: .5, ease: 'back.out(1.3)' }, 0); sfx('whoosh', 0, .5); squash(.48);
  look(10, 0, .6);
  reveal('#t1b', K(1, 'goreng') - .5);
  pop('#noPan', K(1, 'goreng'), { scale: 2.2, rotate: -40 }); sfx('stamp', K(1, 'goreng') + .2, .4); mouth('mO', K(1, 'goreng'));
  conceal('#t1b', K(1, 'salah') - .3); reveal('#t1c', K(1, 'salah') - .1);
  tl.to('#chia .nocap', { scale: 1, duration: .28, ease: 'power4.in' }, K(1, 'salah') - .1);
  tl.to('#chia .crown', { rotate: -16, svgOrigin: '-70 -126', duration: .4, ease: 'back.out(3)' }, K(1, 'salah') + .15);
  tl.to('#noPan', { scale: 0, rotate: 120, autoAlpha: 0, duration: .35, ease: 'back.in(2)' }, K(1, 'salah')); shake(K(1, 'salah') + .1); sfx('stamp', K(1, 'salah') + .15, .7);
  mouth('mS', K(1, 'salah') + .3);

  /* S2 fakta: lompat ke wajan, dipanaskan, tetap stabil */
  const s2 = S(2).start;
  conceal('#t1a', s2 - .2); conceal('#t1c', s2 - .2);
  tl.to('#chia .crown', { y: -260, x: 120, rotate: 50, autoAlpha: 0, duration: .5, ease: 'power2.in' }, s2 - .2);
  pop('#p2', s2 + .1, { scale: .6 });
  tl.to('#chia', { x: 620, duration: .6, ease: 'none' }, s2 + .1); tl.to('#chia', { keyframes: { y: [1080, 820, 1030] }, duration: .6, ease: 'power1.inOut' }, s2 + .1);
  tl.to('#chia', { scale: .62, duration: .6, ease: 'none' }, s2 + .1); armL(70, s2 + .1, .2); armR(-70, s2 + .1, .2);
  sfx('plung', s2 + .7, .7); squash(s2 + .7); armL(0, s2 + .8); armR(0, s2 + .8);
  tl.fromTo('#thermo', { autoAlpha: 0, x: -200 }, { autoAlpha: 1, x: 0, duration: .5, ease: 'back.out(1.6)' }, s2 + .5); sfx('pop', s2 + .5, .5);
  pop('#src2', s2 + .9, { y: 20 });
  heat(.7, K(2, 'dipanaskan') - .1, .9); tl.to('#waves', { opacity: 1, duration: .3 }, K(2, 'dipanaskan'));
  tl.fromTo('.wv', { y: 0, opacity: .9 }, { y: -90, opacity: 0, duration: 1.1, stagger: .25, repeat: 3, ease: 'power1.out' }, K(2, 'dipanaskan'));
  look(-8, -8, K(2, 'dipanaskan')); mouth('mO', K(2, 'dipanaskan') + .2); sfx('tick', K(2, 'dipanaskan'), .4); sfx('tick', K(2, 'dipanaskan') + .4, .4);
  out('#p2', K(2, 'stabil') - .6, .25); reveal('#t2a', K(2, 'stabil') - .3);
  pop('#shield', K(2, 'stabil'), { scale: 0, rotate: -60 }); sfx('ding', K(2, 'stabil') + .1, .6); mouth('mS', K(2, 'stabil')); squash(K(2, 'stabil'));
  armR(-130, K(2, 'stabil') + .1);

  /* S3 aturan: api sedang, jangan berasap */
  const s3 = S(3).start;
  conceal('#t2a', s3 - .25); out('#shield', s3 - .2); out('#src2', s3 - .2); armR(0, s3);
  tl.to('#waves', { opacity: 0, duration: .3 }, s3 - .2);
  reveal('#t3a', s3 + .05);
  pop('#lMed', K(3, 'sedang') - .2, { x: -40 }); heat(.55, K(3, 'sedang') - .1, .5); look(-12, 4, K(3, 'sedang'));
  pop('#lSmoke', K(3, 'berasap') - .5, { x: -40 }); reveal('#t3b', K(3, 'berasap') - .3);
  heat(.9, K(3, 'berasap') - .3, .35);
  tl.to('#smoke', { opacity: .45, duration: .3 }, K(3, 'berasap') - .2);
  tl.fromTo('.pf', { y: 60, scale: .5, transformOrigin: '50% 50%' }, { y: -20, scale: 1, duration: .7, stagger: .08 }, K(3, 'berasap') - .2);
  mouth('mO', K(3, 'berasap') - .1);
  tl.to('#smokeX line', { strokeDashoffset: 0, duration: .25, stagger: .12, ease: 'power2.out' }, K(3, 'berasap') + .25); sfx('stamp', K(3, 'berasap') + .3, .4);

  /* S4 verdict: potong langsung + stempel */
  const s4 = S(4).start;
  tl.set(['#smoke', '#smokeX line'], { opacity: 0 }, s4); tl.set('#smokeX line', { strokeDashoffset: 330 }, s4 + .01); tl.set('#smokeX line', { opacity: 1 }, s4 + .02);
  tl.set(['#t3a', '#t3b'], { autoAlpha: 0 }, s4); heat(.55, s4, .3); mouth('mS', s4); look(0, -6, s4);
  tl.fromTo('#stamp', { autoAlpha: 0, scale: 2.6 }, { autoAlpha: 1, scale: 1, duration: .24, ease: 'power4.in' }, K(4, 'boleh') - .24);
  shake(K(4, 'boleh')); sfx('stamp', K(4, 'boleh'), 1); squash(K(4, 'boleh') + .05); armL(130, K(4, 'boleh') + .05); armR(-130, K(4, 'boleh') + .05);
  pop('#save', K(4, 'simpan') + .2, { y: 30, scale: .7 });
  tl.fromTo('#save', { scale: 1 }, { scale: 1.06, duration: .2, yoyo: true, repeat: 3 }, K(4, 'simpan') + 1);

  /* S5 end card: geser atas */
  const s5 = S(5).start;
  tl.to(['#kit', '#kitFront', '#stamp', '#save', '#thermo', '#lMed', '#lSmoke'], { y: '-=1920', duration: .45, ease: 'power3.inOut' }, s5 - .25); sfx('whoosh', s5 - .3, .6);
  go(540, 1150, .9, s5 - .25, .45); armR(0, s5 - .2, .2); armL(120, s5);
  tl.to('#chia .armL', { rotate: 95, svgOrigin: '-98 10', duration: .2, yoyo: true, repeat: 3, ease: 'sine.inOut' }, s5 + .3);
  pop('#t5', s5 - .05, { y: 40, scale: .9 }, .4); sfx('sparkle', s5, .5);
  tl.set({}, {}, D);
}

const stage = $('#stage'), holder = $('#holder');
function layout() {
  if (RENDER) { holder.style.width = '1080px'; holder.style.height = '1920px'; return; }
  const sc = Math.min(innerWidth / 1080, (innerHeight - 60) / 1920);
  stage.style.transform = `scale(${sc})`; holder.style.width = 1080 * sc + 'px'; holder.style.height = 1920 * sc + 'px';
}
if (RENDER) document.body.classList.add('render');
addEventListener('resize', layout); layout();
window.seek = t => { tl.seek(Math.max(0, Math.min(D, t)), false); };
window.DURATION = D;

Promise.all([document.fonts.load('italic 800 100px Fraunces'), document.fonts.load('italic 900 100px Fraunces'), document.fonts.load('800 40px "Plus Jakarta Sans"'), document.fonts.load('600 24px "Plus Jakarta Sans"')]).then(() => document.fonts.ready).then(() => {
  fit(); build(); seek(0); window.READY = true;
  if (RENDER) return;
  const au = $('#au'), sl = $('#sl'), tm = $('#tm'), pp = $('#pp'); sl.max = D;
  let playing = false, base = 0, t0 = 0;
  const hasAu = () => au.currentSrc && !au.error && au.readyState >= 2;
  const cur = () => playing ? (hasAu() ? au.currentTime : base + (performance.now() - t0) / 1000) : base;
  const ui = t => { seek(t); sl.value = t; tm.textContent = t.toFixed(2); };
  pp.onclick = () => {
    if (!playing) { if (base >= D) base = 0; playing = true; t0 = performance.now(); if (hasAu()) { au.currentTime = base; au.play(); } pp.textContent = 'Pause'; }
    else { base = cur(); playing = false; au.pause(); pp.textContent = 'Play'; }
  };
  sl.oninput = () => { base = +sl.value; t0 = performance.now(); if (hasAu()) au.currentTime = base; ui(base); };
  $('#fi').onchange = e => { const f = e.target.files[0]; if (f) au.src = URL.createObjectURL(f); };
  (function loop() { if (playing) { let t = cur(); if (t >= D) { t = D; playing = false; au.pause(); base = D; pp.textContent = 'Play'; } ui(t); } requestAnimationFrame(loop); })();
});
</script>
